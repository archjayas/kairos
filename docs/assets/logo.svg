<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Kairos logo">
  <!-- Kairos: "the right moment". A clock face whose hand is a check mark
       (confirmed before acting), with a sparkle for AI. -->
  <defs>
    <linearGradient id="kairos-bg" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="0.55" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="kairos-shine" cx="22" cy="16" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="kairos-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.2" flood-color="#1e1b4b" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Badge -->
  <circle cx="32" cy="32" r="30" fill="url(#kairos-bg)"/>
  <circle cx="32" cy="32" r="30" fill="url(#kairos-shine)"/>
  <circle cx="32" cy="32" r="25.5" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.2"/>

  <!-- Clock ticks: long at 12/3/6/9, short elsewhere -->
  <g stroke="#ffffff" stroke-linecap="round">
    <g stroke-width="2.6" stroke-opacity="0.95">
      <line x1="32" y1="8.5" x2="32" y2="13"/>
      <line x1="55.5" y1="32" x2="51" y2="32"/>
      <line x1="32" y1="55.5" x2="32" y2="51"/>
      <line x1="8.5" y1="32" x2="13" y2="32"/>
    </g>
    <g stroke-width="1.6" stroke-opacity="0.6">
      <line x1="43.75" y1="11.65" x2="42.5" y2="13.8"/>
      <line x1="52.35" y1="20.25" x2="50.2" y2="21.5"/>
      <line x1="52.35" y1="43.75" x2="50.2" y2="42.5"/>
      <line x1="43.75" y1="52.35" x2="42.5" y2="50.2"/>
      <line x1="20.25" y1="52.35" x2="21.5" y2="50.2"/>
      <line x1="11.65" y1="43.75" x2="13.8" y2="42.5"/>
      <line x1="11.65" y1="20.25" x2="13.8" y2="21.5"/>
      <line x1="20.25" y1="11.65" x2="21.5" y2="13.8"/>
    </g>
  </g>

  <!-- Check mark (the clock's hands) -->
  <path d="M20.5 33.5 L28.5 41.5 L44 24.5" fill="none" stroke="#ffffff" stroke-width="5.5"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#kairos-shadow)"/>

  <!-- Sparkle -->
  <path d="M50.5 6.5 C51.2 10.3 52.2 11.3 56 12 C52.2 12.7 51.2 13.7 50.5 17.5
           C49.8 13.7 48.8 12.7 45 12 C48.8 11.3 49.8 10.3 50.5 6.5 Z"
        fill="#fde68a" stroke="#ffffff" stroke-width="0.8" stroke-linejoin="round"/>
</svg>
